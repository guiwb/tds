spring.application.name=tds_guilherme

spring.datasource.url=jdbc:mariadb://localhost:3306/tds?createDatabaseIfNotExist=true

spring.datasource.username=root
spring.datasource.password=password
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

springdoc.enable-data-rest=false

api.security.token.secret=${JWT_SECRET:12345678123456781234567812345678}
spring.datasource.hikari.initialization-fail-timeout=30000

spring.ai.mcp.server.name=tds-guilherme-mcp
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.annotation-scanner.enabled=true